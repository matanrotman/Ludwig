dependency_overrides:
  http: ^1.0.0
  device_info_plus: ^11.2.2

  url_protocol:
    git:
      url: https://github.com/LucasXu0/flutter_url_protocol.git
      commit: 737681d

  appflowy_editor:
    git:
      # Forked from AppFlowy-IO/appflowy-editor @ 470c4e7 to add
      # direction-aware positioning for the block-insert ("+") menu in RTL
      # blocks — see specs/rtl-support.md Phase 2. Upstream has no hook for
      # this today; re-evaluate switching back if/when it gains one.
      #
      # Pinned to an exact commit, not the branch name, so that a `pub upgrade`
      # run for any unrelated package can't silently move the editor. The
      # branch this commit lives on is `rtl-direction-aware-selection-menu`.
      #
      # To adopt a new fork commit: push it, then paste its SHA here and run
      # `flutter pub get`. Re-pinning is deliberate by design — forgetting it
      # means the app keeps building the OLD editor code, which has burned us
      # before (comments described fixes that weren't actually running).
      url: https://github.com/matanrotman/appflowy-editor.git
      ref: "65c4dcfb4ae1562bd6d937ea66bc3aacd1681918"

  appflowy_editor_plugins:
    git:
      url: https://github.com/AppFlowy-IO/AppFlowy-plugins.git
      path: "packages/appflowy_editor_plugins"
      ref: "4efcff7"

