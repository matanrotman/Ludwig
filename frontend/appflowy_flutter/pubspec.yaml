flutter:
  generate: true
  uses-material-design: true

  fonts:
    # ---------------------------------------------------------------------
    # Ludwig: 111 Hebrew/Arabic families bundled so a download works offline.
    # GENERATED — regenerate rather than hand-edit (see specs/fonts.md).
    #
    # Declared as ordinary Flutter families rather than left to google_fonts,
    # which matches bundled assets by the filename `Family-Variant.ttf`: 46 of
    # these are VARIABLE fonts named `Cairo[slnt,wght].ttf` that never match,
    # and several families are absent from that package's catalogue entirely.
    # Variable files carry no `weight:` on purpose — Flutter reads the axis.
    # ---------------------------------------------------------------------
    - family: Alef
      fonts:
        - asset: assets/google_fonts_ludwig/Alef-Regular.ttf
          weight: 400
        - asset: assets/google_fonts_ludwig/Alef-Bold.ttf
